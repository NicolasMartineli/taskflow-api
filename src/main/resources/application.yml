spring:
  application:
    name: taskflow-api

  output:
    ansi:
      enabled: always

  datasource:
    url: jdbc:postgresql://localhost:5432/taskflow_db
    username: postgres
    password: postgrespassword
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}

springdoc:
  override-with-generic-response: false

logging:
  file:
    name: logs/taskflow-api.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 100MB
  level:
    root: INFO
    com.nicolasmartineli.taskflow_api: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%clr(%d{HH:mm:ss.SSS}){faint} %clr([%X{requestId:-}]){yellow} %clr(%5p) %clr(%-30.30logger{29}){cyan} : %m%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{requestId:-}] %5p %-40.40logger{39} : %m%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never

info:
  app:
    name: TaskFlow API
    description: REST API for team task management
    version: 1.0.0